<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SteamSell</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #f4f4f7);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --accent: var(--tg-theme-button-color, #007aff);
      --discount-bg: #4c6b22;
      --discount-text: #beee11;
      --free-color: #34c759;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }

    header { text-align: center; margin-bottom: 14px; }
    header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 11px; color: var(--hint); }

    .search-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }
    .search-box:focus { border-color: var(--accent); }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      background: var(--card);
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .games-list { display: flex; flex-direction: column; gap: 10px; }
    .status-msg { text-align: center; padding: 35px 15px; color: var(--hint); font-size: 14px; line-height: 1.5; }

    .card {
      display: flex;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .card:active { opacity: 0.75; }

    .card img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      background: #e5e5ea;
      flex-shrink: 0;
    }

    .info {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
      gap: 4px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prices { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .discount-badge {
      background: var(--discount-bg);
      color: var(--discount-text);
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .old-price { text-decoration: line-through; color: var(--hint); font-size: 12px; }
    .new-price { font-weight: 700; color: #4c6b22; }
    .regular-price { font-weight: 600; color: var(--text); }
    .free-price { font-weight: 600; color: var(--free-color); }
    .no-price { font-size: 12px; color: var(--hint); }
  </style>
</head>
<body>

  <header>
    <h1>SteamSell 🎮</h1>
    <p>Регион: РФ (RUB ₽) • Нажмите для перехода в Steam</p>
  </header>

  <input type="text" id="search" class="search-box" placeholder="Поиск по всему каталогу Steam...">

  <div class="categories">
    <div class="cat-btn active" onclick="switchCategory('discounts', this)">🔥 Только скидки</div>
    <div class="cat-btn" onclick="switchCategory('all', this)">🌐 Все игры (Топ)</div>
  </div>

  <div class="games-list" id="games">
    <div class="status-msg">Загрузка актуальных цен Steam... ⏳</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // ВАЖНО: замените на адрес вашего Cloudflare Worker (без слэша в конце)
    const API = "https://green-brook-6734.daniilbobkov47.workers.dev/";

    let currentCategory = 'discounts';
    let featuredDiscounts = [];
    let featuredAll = [];
    let searchTimer = null;

    // Загрузка данных через собственный прокси на Cloudflare Workers
    async function fetchFromSteam(path) {
      const res = await fetch(API + path);
      if (!res.ok) throw new Error("Ошибка прокси");
      return await res.json();
    }

    function openSteamApp(appId) {
      const url = `https://store.steampowered.com/app/${appId}/`;
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function renderPrice(item) {
      if (item.is_free || item.final_price === 0) {
        return `<span class="free-price">Бесплатно</span>`;
      }
      if (item.discount_percent && item.discount_percent > 0) {
        const oldP = (item.original_price / 100).toLocaleString('ru-RU') + " ₽";
        const newP = (item.final_price / 100).toLocaleString('ru-RU') + " ₽";
        return `
          <span class="discount-badge">-${item.discount_percent}%</span>
          <span class="old-price">${oldP}</span>
          <span class="new-price">${newP}</span>
        `;
      }
      if (item.final_price) {
        return `<span class="regular-price">${(item.final_price / 100).toLocaleString('ru-RU')} ₽</span>`;
      }
      return `<span class="no-price">В корзину / Нет цены</span>`;
    }

    // Загрузка реальных акций главной страницы Steam
    async function loadFeatured() {
      const list = document.getElementById("games");
      list.innerHTML = `<div class="status-msg">Получаем официальные акции Steam... ⏳</div>`;

      try {
        const data = await fetchFromSteam("/featured");

        // 1. Только скидки
        featuredDiscounts = (data.specials?.items || []).map(g => ({
          id: g.id,
          name: g.name,
          img: g.header_image || `https://cdn.akamai.steamstatic.com/steam/apps/${g.id}/header.jpg`,
          original_price: g.original_price,
          final_price: g.final_price,
          discount_percent: g.discount_percent,
          is_free: false
        }));

        // 2. Все популярные игры
        const seen = new Set();
        featuredAll = [];
        const pool = [...(data.top_sellers?.items || []), ...(data.new_releases?.items || []), ...(data.specials?.items || [])];

        pool.forEach(g => {
          if (!g || seen.has(g.id)) return;
          seen.add(g.id);
          featuredAll.push({
            id: g.id,
            name: g.name,
            img: g.header_image || `https://cdn.akamai.steamstatic.com/steam/apps/${g.id}/header.jpg`,
            original_price: g.original_price,
            final_price: g.final_price,
            discount_percent: g.discount_percent || 0,
            is_free: false
          });
        });

        displayList(currentCategory === 'discounts' ? featuredDiscounts : featuredAll);
      } catch (err) {
        list.innerHTML = `
          <div class="status-msg">
            Не удалось получить витрину Steam.<br>
            Попробуйте воспользоваться поиском выше.
          </div>
        `;
      }
    }

    // Поиск по ВСЕМ существующим играм Steam в реальном времени
    async function searchGlobalSteam(query) {
      const list = document.getElementById("games");
      list.innerHTML = `<div class="status-msg">Ищем «${query}» по всей базе Steam... ⏳</div>`;

      try {
        const data = await fetchFromSteam(`/search?term=${encodeURIComponent(query)}`);
        let items = (data.items || []).map(g => ({
          id: g.id,
          name: g.name,
          img: g.tiny_image || `https://cdn.akamai.steamstatic.com/steam/apps/${g.id}/header.jpg`,
          original_price: g.price?.initial,
          final_price: g.price?.final,
          discount_percent: g.price?.discount_percent || 0,
          is_free: Boolean(g.is_free || (g.price && g.price.final === 0))
        }));

        if (currentCategory === 'discounts') {
          items = items.filter(g => g.discount_percent > 0);
        }

        displayList(items);
      } catch (err) {
        list.innerHTML = `<div class="status-msg">Ошибка поиска. Попробуйте еще раз.</div>`;
      }
    }

    function displayList(games) {
      const list = document.getElementById("games");
      list.innerHTML = "";

      if (!games || games.length === 0) {
        list.innerHTML = `<div class="status-msg">Игры не найдены</div>`;
        return;
      }

      games.forEach(g => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openSteamApp(g.id);

        card.innerHTML = `
          <img src="${g.img}" alt="${g.name}" loading="lazy" onerror="this.src='https://cdn.akamai.steamstatic.com/steam/apps/${g.id}/header.jpg'">
          <div class="info">
            <div class="title" title="${g.name}">${g.name}</div>
            <div class="prices">${renderPrice(g)}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const query = document.getElementById("search").value.trim();
      if (query.length > 0) {
        searchGlobalSteam(query);
      } else {
        displayList(currentCategory === 'discounts' ? featuredDiscounts : featuredAll);
      }
    }

    // Слушатель поиска с задержкой 400 мс (чтобы не спамить запросами)
    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.trim();
      clearTimeout(searchTimer);

      if (q.length === 0) {
        displayList(currentCategory === 'discounts' ? featuredDiscounts : featuredAll);
        return;
      }

      searchTimer = setTimeout(() => {
        searchGlobalSteam(q);
      }, 400);
    });

    loadFeatured();
  </script>
</body>
</html>
