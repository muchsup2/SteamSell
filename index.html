<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SteamSell</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #171a21);
      --card: var(--tg-theme-secondary-bg-color, #1b2838);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8f98a0);
      --accent: var(--tg-theme-button-color, #66c0f4);
      --discount-bg: #4c6b22;
      --discount-text: #beee11;
      --free-color: #5c7e10;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }

    header { text-align: center; margin-bottom: 14px; }
    header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 11px; color: var(--hint); }

    .search-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }
    .search-box:focus { border-color: var(--accent); }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      background: var(--card);
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cat-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: transparent;
    }

    .games-list { display: flex; flex-direction: column; gap: 10px; }
    .status-msg { text-align: center; padding: 30px 10px; color: var(--hint); font-size: 14px; }

    .card {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .card:active { opacity: 0.8; }

    .card img {
      width: 120px;
      height: 65px;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }

    .info {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
      gap: 4px;
    }

    .title {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prices { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .discount-badge {
      background: var(--discount-bg);
      color: var(--discount-text);
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .old-price { text-decoration: line-through; color: var(--hint); font-size: 12px; }
    .new-price { font-weight: 700; color: #a4d007; }
    .free-price { font-weight: 600; color: var(--free-color); }
    .no-price { font-size: 12px; color: var(--hint); }
  </style>
</head>
<body>

  <header>
    <h1>SteamSell 🎮</h1>
    <p>Регион: РФ • Нажмите для перехода в Steam</p>
  </header>

  <input type="text" id="search" class="search-box" placeholder="Поиск по названию игры...">

  <div class="categories">
    <div class="cat-btn active" onclick="switchCategory('discounts', this)">🔥 Только скидки</div>
    <div class="cat-btn" onclick="switchCategory('all', this)">🌐 Все игры</div>
  </div>

  <div class="games-list" id="games">
    <div class="status-msg">Загрузка актуальных скидок... ⏳</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Резервная база актуальных скидок и популярных игр РФ региона
    const catalog = [
      { id: 292030, name: "The Witcher 3: Wild Hunt - Complete Edition", disc: "-75%", old: "1 500 ₽", price: "375 ₽", hasDiscount: true },
      { id: 1091500, name: "Cyberpunk 2077", disc: "-50%", old: "2 100 ₽", price: "1 050 ₽", hasDiscount: true },
      { id: 782330, name: "DOOM Eternal", disc: "-80%", old: "2 800 ₽", price: "560 ₽", hasDiscount: true },
      { id: 289070, name: "Sid Meier’s Civilization VI", disc: "-90%", old: "1 999 ₽", price: "199 ₽", hasDiscount: true },
      { id: 367520, name: "Hollow Knight", disc: "-50%", old: "550 ₽", price: "275 ₽", hasDiscount: true },
      { id: 1145360, name: "Hades", disc: "-66%", old: "880 ₽", price: "299 ₽", hasDiscount: true },
      { id: 252490, name: "Rust", disc: "-33%", old: "1 499 ₽", price: "1 004 ₽", hasDiscount: true },
      { id: 1086940, name: "Baldur's Gate 3", disc: "-20%", old: "1 999 ₽", price: "1 599 ₽", hasDiscount: true },
      { id: 730, name: "Counter-Strike 2", disc: null, old: null, price: "Бесплатно", hasDiscount: false },
      { id: 570, name: "Dota 2", disc: null, old: null, price: "Бесплатно", hasDiscount: false },
      { id: 1172470, name: "Apex Legends", disc: null, old: null, price: "Бесплатно", hasDiscount: false }
    ];

    let currentGames = catalog;
    let currentCategory = 'discounts';

    function openSteamApp(appId) {
      const url = `https://store.steampowered.com/app/${appId}/`;
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    async function tryFetchLiveSteam() {
      const target = "https://store.steampowered.com/api/featuredcategories/?cc=ru&l=russian";
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`);
        const json = await res.json();
        const data = JSON.parse(json.contents);
        
        if (data && data.specials && data.specials.items) {
          const live = [];
          data.specials.items.forEach(g => {
            live.push({
              id: g.id,
              name: g.name,
              disc: g.discount_percent ? `-${g.discount_percent}%` : null,
              old: g.original_price ? (g.original_price / 100).toLocaleString('ru-RU') + " ₽" : null,
              price: g.final_price ? (g.final_price / 100).toLocaleString('ru-RU') + " ₽" : "Бесплатно",
              hasDiscount: Boolean(g.discount_percent && g.discount_percent > 0)
            });
          });
          if (live.length > 0) currentGames = live;
        }
      } catch (e) {
        // При блокировке остаётся надёжный встроенный каталог
      }
      render();
    }

    function render() {
      const q = document.getElementById("search").value.toLowerCase().trim();
      const list = document.getElementById("games");
      list.innerHTML = "";

      const filtered = currentGames.filter(g => {
        const matchCat = (currentCategory === 'all') || (currentCategory === 'discounts' && g.hasDiscount);
        const matchQ = g.name.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      if (!filtered.length) {
        list.innerHTML = `<div class="status-msg">Игры не найдены</div>`;
        return;
      }

      filtered.forEach(g => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openSteamApp(g.id);

        let priceHtml = '';
        if (g.hasDiscount && g.disc) {
          priceHtml = `
            <span class="discount-badge">${g.disc}</span>
            <span class="old-price">${g.old}</span>
            <span class="new-price">${g.price}</span>
          `;
        } else if (g.price === "Бесплатно") {
          priceHtml = `<span class="free-price">Бесплатно</span>`;
        } else {
          priceHtml = `<span class="new-price" style="color: #fff;">${g.price}</span>`;
        }

        const imgUrl = `https://cdn.akamai.steamstatic.com/steam/apps/${g.id}/header.jpg`;

        card.innerHTML = `
          <img src="${imgUrl}" alt="${g.name}" loading="lazy">
          <div class="info">
            <div class="title" title="${g.name}">${g.name}</div>
            <div class="prices">${priceHtml}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    }

    document.getElementById("search").addEventListener("input", render);

    // Первичная отрисовка и попытка обновления
    render();
    tryFetchLiveSteam();
  </script>
</body>
</html>
